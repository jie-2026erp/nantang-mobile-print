<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>提货单打印</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:#f5f5f5;padding:10px}
h2{text-align:center;padding:10px;font-size:18px}
.item{background:#fff;border-radius:8px;padding:12px;margin-bottom:8px}
.item .row1{display:flex;justify-content:space-between;align-items:center}
.item .code{font-size:16px;font-weight:bold}
.item .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin-top:8px;font-size:12px;color:#555}
.item .grid div{background:#f9f9f9;padding:4px 6px;border-radius:4px}
.item .grid b{color:#333}
.item .status{font-size:11px;padding:2px 8px;border-radius:10px;display:inline-block}
.st0{background:#fff3e0;color:#e65100}
.st1{background:#e8f5e9;color:#2e7d32}
button{background:#4CAF50;color:#fff;border:none;padding:10px 16px;border-radius:6px;font-size:14px;width:100%;margin-top:8px}
button:disabled{background:#aaa}
button.ok{background:#2e7d32}
button.err{background:#c62828}
.btn-row{display:flex;gap:8px;margin-top:8px}
.btn-row button{width:auto;flex:1;margin-top:0}
button.up{background:#2196F3}
.loading{text-align:center;padding:20px;color:#666}
.refresh{text-align:center;margin-bottom:10px}
.refresh button{background:#2196F3;padding:6px 16px;font-size:13px;width:auto}
.time{text-align:center;font-size:11px;color:#999;margin-bottom:8px}
.nav{margin-bottom:10px;text-align:center}
.nav a{display:inline-block;background:#673AB7;color:#fff;text-decoration:none;padding:10px 16px;border-radius:6px;font-size:14px;margin:0 4px}
</style></head><body>
<h2>金华2仓提货单打印</h2>
<div class="time">仅列出未上传附件的提货单</div>
<div class="nav"><a href="ship.html">📦 货件标签</a><a href="voucher2.html">📋 交接凭证</a></div>
<div class="refresh"><button onclick="loadList()">刷新列表</button></div>
<div class="time" id="time">更新于 2026-11-13 16:09</div>
<div id="list"></div>
<script>
const REPO="jie-2026erp/nantang-mobile-print";
const TOKEN="ghp_"+"k45BP43dqN2YcPDrra6u1Qesn1NijV2V0XdJ";
let STAFF_ID="01296965214729277422";
let STAFF_NAME="王梦吉";
const ITEMS=[{"id": 38891, "batch_code": "TH26111300308", "create_name": "定文焱", "datetime": "2026-11-13 15:58:05", "transport_name": "海运", "provider_name": "喜运达", "sum_box": "145", "sum_pcs": 1488, "sum_bulk": "14.8070", "inbound_count": 14, "status": 0, "print_status": 0, "status_name": "未标记", "attachment": [], "end_time": "", "warehouse_name": "FBA中转仓-金华2仓", "is_write": "已填写", "delivery_method": "物流", "export_label": "已导出", "is_upload_attachment": "未上传"}, {"id": 38890, "batch_code": "TH26111300307", "create_name": "李晶晶", "datetime": "2026-11-13 15:55:01", "transport_name": "海运", "provider_name": "路易通", "sum_box": "31", "sum_pcs": 117, "sum_bulk": "2.8758", "inbound_count": 3, "status": 0, "print_status": 1, "status_name": "未标记", "attachment": [], "end_time": "", "warehouse_name": "FBA中转仓-金华2仓", "is_write": "已填写", "delivery_method": "货代", "export_label": "已导出", "is_upload_attachment": "未上传"}, {"id": 38889, "batch_code": "TH26111300306", "create_name": "李晶晶", "datetime": "2026-11-13 15:51:39", "transport_name": "海运", "provider_name": "满天星", "sum_box": "185", "sum_pcs": 1023, "sum_bulk": "17.8047", "inbound_count": 32, "status": 0, "print_status": 0, "status_name": "未标记", "attachment": [], "end_time": "", "warehouse_name": "FBA中转仓-金华2仓", "is_write": "已填写", "delivery_method": "货代", "export_label": "已导出", "is_upload_attachment": "未上传"}, {"id": 38887, "batch_code": "TH26111300304", "create_name": "李晶晶", "datetime": "2026-11-13 15:43:54", "transport_name": "海运", "provider_name": "路易通", "sum_box": "41", "sum_pcs": 1128, "sum_bulk": "4.3674", "inbound_count": 10, "status": 2, "print_status": 1, "status_name": "已标记", "attachment": [], "end_time": "2026-11-13 16:03:46", "warehouse_name": "FBA中转仓-金华2仓", "is_write": "已填写", "delivery_method": "货代", "export_label": "已导出", "is_upload_attachment": "未上传"}];

function h5Url(code){
return 'http://h5.fba.nantang-tech.com//?id="'+STAFF_ID+'"&userName='+encodeURIComponent(STAFF_NAME)+'&batch_code='+encodeURIComponent(code)+'#/deliverymanagement';
}
function openUpload(code){window.location.href=h5Url(code);}

function render(items){
if(!items||!items.length){document.getElementById('list').innerHTML='<div class="loading">暂无需上传附件的提货单</div>';return}
let html='';
items.forEach(it=>{
let ps=it.print_status==1?'<span class="status st1">已打印</span>':'<span class="status st0">未打印</span>';
html+=`<div class="item"><div class="row1"><div class="code">${it.batch_code}</div>${ps}</div>
<div class="grid">
<div>物流商<br><b>${it.provider_name||'-'}</b></div>
<div>货件<br><b>${it.inbound_count||'-'}</b></div>
<div>箱数<br><b>${it.sum_box||'-'}</b></div>
<div>PCS<br><b>${it.sum_pcs||'-'}</b></div>
<div>体积<br><b>${it.sum_bulk||'-'}</b></div>
<div>状态<br><b>${it.status_name||'-'}</b></div>
<div>收货人<br><b>${it.is_write||'-'}</b></div>
</div>
<div class="btn-row">
<button id="btn_${it.id}" onclick="doPrint(${it.id},'${it.batch_code}')">打印</button>
<button class="up" onclick="openUpload('${it.batch_code}')">上传附件</button>
</div>
</div>`;
});
document.getElementById('list').innerHTML=html;
}

async function loadList(){
try{
let r=await fetch('https://jie-2026erp.github.io/nantang-mobile-print/data.json?t='+Date.now());
let d=await r.json();
if(d.staffId) STAFF_ID=d.staffId;
if(d.staffName) STAFF_NAME=d.staffName;
render(d.list||[]);
document.getElementById('time').textContent='更新于 '+(d.time||'');
}catch(e){document.getElementById('time').textContent='刷新失败，请点重试'}
}

let printChain=Promise.resolve();
function enqueue(fn){
const run=printChain.then(fn,fn);
printChain=run.catch(()=>{});
return run;
}

async function readTasks(){
let r=await fetch('https://api.github.com/repos/'+REPO+'/contents/tasks.json',{headers:{'User-Agent':'print-app'}});
if(!r.ok) throw new Error('读取队列失败 '+r.status);
let j=await r.json();
return {sha:j.sha,content:JSON.parse(atob(j.content))};
}

async function submitTask(id,code){
const req=Date.now()+'-'+Math.random().toString(36).slice(2,8);
let lastErr='';
for(let attempt=1;attempt<=3;attempt++){
try{
let {sha,content}=await readTasks();
let running=content.some(x=>x.id==id&&(x.status==='pending'||x.status==='processing'));
if(running) return {dup:true};
content.push({id:id,code:code,time:new Date().toISOString(),req:req,status:'pending'});
let body={message:'print '+code,content:btoa(unescape(encodeURIComponent(JSON.stringify(content,null,2)))),sha:sha};
let put=await fetch('https://api.github.com/repos/'+REPO+'/contents/tasks.json',{method:'PUT',headers:{Authorization:'token '+TOKEN,'User-Agent':'print-app','Content-Type':'application/json'},body:JSON.stringify(body)});
// 写入后回查队列：以队列真实状态为准，响应丢失不代表没写进去
await new Promise(r=>setTimeout(r,600));
try{
let {content:after}=await readTasks();
if(after.some(x=>x.req===req)) return {ok:true,req:req};
}catch(_){}
if(put.ok) return {ok:true,req:req};
lastErr='写入失败 '+put.status;
try{let ej=await put.json();if(ej&&ej.message)lastErr='写入失败: '+ej.message}catch(_){}
}catch(e){lastErr='网络错误: '+e}
if(attempt<3) await new Promise(r=>setTimeout(r,1000));
}
// 抛错前最后回查一次：本次任务已实际入队则不算失败
try{
let {content:final}=await readTasks();
if(final.some(x=>x.req===req)) return {ok:true,req:req};
}catch(_){}
throw new Error(lastErr);
}

async function doPrint(id,code){
let btn=document.getElementById('btn_'+id);
btn.disabled=true;btn.textContent='正在提交...';
try{
let res=await enqueue(()=>submitTask(id,code));
if(res&&res.dup){btn.textContent='该单正在排队，请勿重复点击';btn.disabled=false;return;}
const myReq=res.req;
btn.textContent='已提交，等待打印...';
let check=setInterval(async()=>{
try{
let {content}=await readTasks();
let task=content.filter(x=>x.req===myReq).pop()||content.filter(x=>x.id==id).pop();
if(task&&task.status==='done'){clearInterval(check);btn.textContent='✓ 打印成功';btn.classList.add('ok');setTimeout(loadList,3000)}
if(task&&task.status==='error'){clearInterval(check);btn.textContent='✗ 打印失败:'+(task.msg||'');btn.classList.add('err');btn.disabled=false}
}catch(e){}
},2000);
setTimeout(()=>{clearInterval(check);if(!btn.classList.contains('ok')){btn.textContent='超时未完成，请查看电脑端';btn.disabled=false}},120000);
}catch(e){btn.textContent='错误: '+e;btn.disabled=false}
}
render(ITEMS);
</script></body></html>

function render(items){
if(!items||!items.length){document.getElementById('list').innerHTML='<div class="loading">今天暂无提货单</div>';return}
let html='';
items.forEach(it=>{
let ps=it.print_status==1?'<span class="status st1">已打印</span>':'<span class="status st0">未打印</span>';
html+=`<div class="item"><div class="row1"><div class="code">${it.batch_code}</div>${ps}</div>
<div class="grid">
<div>物流商<br><b>${it.provider_name||'-'}</b></div>
<div>货件<br><b>${it.inbound_count||'-'}</b></div>
<div>箱数<br><b>${it.sum_box||'-'}</b></div>
<div>PCS<br><b>${it.sum_pcs||'-'}</b></div>
<div>体积<br><b>${it.sum_bulk||'-'}</b></div>
<div>状态<br><b>${it.status_name||'-'}</b></div>
<div>收货人<br><b>${it.is_write||'-'}</b></div>
</div>
<button id="btn_${it.id}" onclick="doPrint(${it.id},'${it.batch_code}')">打印</button>
</div>`;
});
document.getElementById('list').innerHTML=html;
}

async function loadList(){
try{
let r=await fetch('https://jie-2026erp.github.io/nantang-mobile-print/data.json?t='+Date.now());
let d=await r.json();
render(d.list||[]);
document.getElementById('time').textContent='更新于 '+(d.time||'');
}catch(e){document.getElementById('time').textContent='刷新失败，请点重试'}
}

let printChain=Promise.resolve();
function enqueue(fn){
const run=printChain.then(fn,fn);
printChain=run.catch(()=>{});
return run;
}

async function readTasks(){
let r=await fetch('https://api.github.com/repos/'+REPO+'/contents/tasks.json',{headers:{'User-Agent':'print-app'}});
if(!r.ok) throw new Error('读取队列失败 '+r.status);
let j=await r.json();
return {sha:j.sha,content:JSON.parse(atob(j.content))};
}

async function submitTask(id,code){
let lastErr='';
for(let attempt=1;attempt<=3;attempt++){
try{
let {sha,content}=await readTasks();
let running=content.some(x=>x.id==id&&(x.status==='pending'||x.status==='processing'));
if(running) return {dup:true};
content.push({id:id,code:code,time:new Date().toISOString(),status:'pending'});
let body={message:'print '+code,content:btoa(unescape(encodeURIComponent(JSON.stringify(content,null,2)))),sha:sha};
let put=await fetch('https://api.github.com/repos/'+REPO+'/contents/tasks.json',{method:'PUT',headers:{Authorization:'token '+TOKEN,'User-Agent':'print-app','Content-Type':'application/json'},body:JSON.stringify(body)});
if(put.ok) return {ok:true};
lastErr='写入失败 '+put.status;
try{let ej=await put.json();if(ej&&ej.message)lastErr='写入失败: '+ej.message}catch(_){}
}catch(e){lastErr='网络错误: '+e}
if(attempt<3) await new Promise(r=>setTimeout(r,1000));
}
throw new Error(lastErr);
}

async function doPrint(id,code){
let btn=document.getElementById('btn_'+id);
btn.disabled=true;btn.textContent='正在提交...';
try{
let res=await enqueue(()=>submitTask(id,code));
if(res&&res.dup){btn.textContent='该单正在排队，请勿重复点击';btn.disabled=false;return;}
btn.textContent='已提交，等待打印...';
let check=setInterval(async()=>{
try{
let {content}=await readTasks();
let task=content.filter(x=>x.id==id).pop();
if(task&&task.status==='done'){clearInterval(check);btn.textContent='✓ 打印成功';btn.classList.add('ok');setTimeout(loadList,3000)}
if(task&&task.status==='error'){clearInterval(check);btn.textContent='✗ 打印失败:'+(task.msg||'');btn.classList.add('err');btn.disabled=false}
}catch(e){}
},2000);
setTimeout(()=>{clearInterval(check);if(!btn.classList.contains('ok')){btn.textContent='超时未完成，请查看电脑端';btn.disabled=false}},120000);
}catch(e){btn.textContent='错误: '+e;btn.disabled=false}
}
render(ITEMS);

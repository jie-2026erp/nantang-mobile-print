function h5Url(code){
return 'http://h5.wms.nantang-tech.com/?id='+encodeURIComponent(STAFF_ID)+'&userName='+encodeURIComponent(STAFF_NAME)+'&order_code='+encodeURIComponent(code)+'#/uploadhandovervoucher';
}
function openUpload(code){window.location.href=h5Url(code);}

function render(items){
if(!items||!items.length){document.getElementById('list').innerHTML='<div class="loading">暂无待处理单据</div>';return}
let html='';
items.forEach(it=>{
html+=`<div class="item"><div class="row1"><div class="code">${it.code}</div><span class="status st0">待传凭证</span></div>
<div class="grid">
<div>仓库<br><b>${it.warehouse||'-'}</b></div>
<div>平台<br><b>${it.platform||'-'}</b></div>
<div>物流商<br><b>${it.provider||'-'}</b></div>
<div>订单数<br><b>${it.order_count||'-'}</b></div>
<div>重量kg<br><b>${it.weight||'-'}</b></div>
<div>组包时间<br><b>${(it.created_at||'-').slice(5,16)}</b></div>
<div>组包人<br><b>${it.create_name||'-'}</b></div>
<div>交接人<br><b>${it.deliver_name||'-'}</b></div>
</div>
<div class="btn-row">
<button id="btnp_${it.id}" onclick="doPrint(${it.id},'${it.code}')">🖨 打印提货单</button>
<button class="up" onclick="openUpload('${it.code}')">📋 上传凭证</button>
</div>
</div>`;
});
document.getElementById('list').innerHTML=html;
}

async function readTasks(){
let r=await fetch('https://api.github.com/repos/'+REPO+'/contents/voucher_tasks.json',{headers:{'User-Agent':'print-app'}});
if(!r.ok) throw new Error('读取队列失败 '+r.status);
let j=await r.json();
return {sha:j.sha,content:JSON.parse(atob(j.content))};
}

async function doPrint(id,code){
let btn=document.getElementById('btnp_'+id);
btn.disabled=true;btn.textContent='正在提交...';
try{
let {sha,content}=await readTasks();
let running=content.some(x=>x.id==id&&(x.status==='pending'||x.status==='processing'));
if(running){btn.textContent='该单正在排队，勿重复点';btn.disabled=false;return;}
let req=Date.now()+'-'+Math.random().toString(36).slice(2,8);
content.push({id:id,code:code,req:req,time:new Date().toISOString(),status:'pending'});
let body={message:'print slip '+code,content:btoa(unescape(encodeURIComponent(JSON.stringify(content,null,2)))),sha:sha};
await fetch('https://api.github.com/repos/'+REPO+'/contents/voucher_tasks.json',{method:'PUT',headers:{Authorization:'token '+TOKEN,'User-Agent':'print-app','Content-Type':'application/json'},body:JSON.stringify(body)});
btn.textContent='已提交，等待打印...';
let check=setInterval(async()=>{
try{
let {content:t}=await readTasks();
let task=t.find(x=>x.req===req)||t.find(x=>x.id==id);
if(task&&task.status==='done'){clearInterval(check);btn.textContent='✓ 提货单已打印';btn.classList.add('ok');setTimeout(loadList,3000)}
if(task&&task.status==='error'){clearInterval(check);btn.textContent='✗ 打印失败:'+(task.msg||'');btn.classList.add('err');btn.disabled=false}
}catch(e){}
},2000);
setTimeout(()=>{clearInterval(check);if(!btn.classList.contains('ok')){btn.textContent='超时未完成，请看电脑端';btn.disabled=false}},120000);
}catch(e){btn.textContent='错误: '+e;btn.disabled=false}
}

async function loadList(){
try{
let r=await fetch('https://jie-2026erp.github.io/nantang-mobile-print/voucher_data.json?t='+Date.now());
let d=await r.json();
if(d.staffId) STAFF_ID=d.staffId;
if(d.staffName) STAFF_NAME=d.staffName;
render(d.list||[]);
document.getElementById('time').textContent='更新于 '+(d.time||'');
}catch(e){document.getElementById('time').textContent='刷新失败，请点重试'}
}

render(ITEMS);
</script></body></html>

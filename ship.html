function render(items){
if(!items||!items.length){document.getElementById('list').innerHTML='<div class="loading">暂无可打印货件标签</div>';return}
let html='';
items.forEach(it=>{
let ps=it.status==='已打印'?'<span class="status st1">已打印</span>':'<span class="status st0">未打印</span>';
let err=it.err?`<div class="err">异常: ${it.err}</div>`:'';
html+=`<div class="item"><div class="row1"><div class="code">${it.code}</div>${ps}</div>
<div class="grid">
<div>平台<br><b>${it.platformText||it.platform||'-'}</b></div>
<div>库位<br><b>${it.space||'-'}</b></div>
<div>箱数<br><b>${it.boxes||'-'}</b></div>
<div>毛重<br><b>${it.weight||'-'}</b></div>
<div>店铺<br><b>${(it.shop||'-')}</b></div>
<div>站点<br><b>${it.site||'-'}</b></div>
</div>${err}
<button id="btn_${it.id}" onclick="doPrint(${it.id},'${it.code}','${it.platform}',${it.boxes||0})">打印箱子标签</button>
</div>`;
});
document.getElementById('list').innerHTML=html;
}

async function loadList(){
try{
let r=await fetch('https://api.github.com/repos/'+REPO+'/contents/ship_data.json',{headers:{'User-Agent':'print-app'}});
let j=await r.json();
let d=JSON.parse(atob(j.content));
render(d.list||[]);
document.getElementById('time').textContent='更新于 '+(d.time||'');
}catch(e){}
}

async function doPrint(id,code,platform,boxes){
let btn=document.getElementById('btn_'+id);
btn.disabled=true;btn.textContent='正在提交...';
try{
let tr=await fetch('https://api.github.com/repos/'+REPO+'/contents/ship_tasks.json',{headers:{'User-Agent':'print-app'}});
let tf=await tr.json();
let content=JSON.parse(atob(tf.content));
content.push({id:id,code:code,platform:platform,boxes:boxes,time:new Date().toISOString(),status:'pending'});
let body={message:'print '+code,content:btoa(unescape(encodeURIComponent(JSON.stringify(content,null,2)))),sha:tf.sha};
await fetch('https://api.github.com/repos/'+REPO+'/contents/ship_tasks.json',{method:'PUT',headers:{Authorization:'token '+TOKEN,'User-Agent':'print-app','Content-Type':'application/json'},body:JSON.stringify(body)});
btn.textContent='已提交，等待打印...';
let check=setInterval(async()=>{
let r=await fetch('https://api.github.com/repos/'+REPO+'/contents/ship_tasks.json',{headers:{'User-Agent':'print-app'}});
let j=await r.json();
let t=JSON.parse(atob(j.content));
let task=t.find(x=>x.id==id);
if(task&&task.status==='done'){clearInterval(check);btn.textContent='✓ 打印成功';btn.classList.add('ok');setTimeout(loadList,3000)}
if(task&&task.status==='error'){clearInterval(check);btn.textContent='✗ 打印失败:'+(task.msg||'');btn.classList.add('err');btn.disabled=false}
},2000);
}catch(e){btn.textContent='错误: '+e;btn.disabled=false}
}
render(ITEMS);

<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>货件标签打印</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:#f5f5f5;padding:10px}
h2{text-align:center;padding:10px;font-size:18px}
.item{background:#fff;border-radius:8px;padding:12px;margin-bottom:8px}
.item .row1{display:flex;justify-content:space-between;align-items:center}
.item .code{font-size:16px;font-weight:bold}
.item .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin-top:8px;font-size:12px;color:#555}
.item .grid div{background:#f9f9f9;padding:4px 6px;border-radius:4px}
.item .grid b{color:#333}
.item .status{font-size:11px;padding:2px 8px;border-radius:10px;display:inline-block}
.st0{background:#fff3e0;color:#e65100}
.st1{background:#e8f5e9;color:#2e7d32}
.err{color:#c62822;font-size:11px;margin-top:6px}
button{background:#4CAF50;color:#fff;border:none;padding:10px 16px;border-radius:6px;font-size:14px;width:100%;margin-top:8px}
button:disabled{background:#aaa}
button.ok{background:#2e7d32}
button.err{background:#c62828}
.loading{text-align:center;padding:20px;color:#666}
.refresh{text-align:center;margin-bottom:10px}
.refresh button{background:#2196F3;padding:6px 16px;font-size:13px;width:auto}
.time{text-align:center;font-size:11px;color:#999;margin-bottom:8px}
.nav{margin-bottom:10px;text-align:center}
.nav a{display:inline-block;background:#673AB7;color:#fff;text-decoration:none;padding:10px 16px;border-radius:6px;font-size:14px;margin:0 4px}
.manual{background:#fff;border-radius:8px;padding:12px;margin-bottom:10px}
.manual input{width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;font-size:15px}
.manual button{margin-top:8px}
</style></head><body>
<h2>金华2仓 货件标签打印</h2>
<div class="nav"><a href="index.html">← 提货单</a><a href="voucher2.html">📋 交接凭证</a></div>
<div class="refresh"><button onclick="loadList()">刷新列表</button></div>
<div class="manual">
<input id="manualCode" placeholder="输入货件单号，如 HWC261112071" autocomplete="off">
<button class="ok" id="manualBtn" onclick="doManual()">手动打印该单号</button>
</div>
<div class="time" id="time">更新于 2026-11-13 22:08</div>
<div id="list"></div>
<script>
const REPO="jie-2026erp/nantang-mobile-print";
const TOKEN="ghp_"+"k45BP43dqN2YcPDrra6u1Qesn1NijV2V0XdJ";
const ITEMS=[{"id": 1207760, "code": "HWC261112013", "platform": "NEWOUDA", "platformText": "新欧达", "shop": "Shopify135店-monportlaser.de", "space": "FH-4-75", "boxes": 9, "weight": "175.6", "volume": "109.12", "status": "未打印", "err": "", "site": "DE"}];

function render(items){
if(!items||!items.length){document.getElementById('list').innerHTML='<div class="loading">暂无可打印货件标签</div>';return}
let html='';
items.forEach(it=>{
let ps=it.status==='已打印'?'<span class="status st1">已打印</span>':'<span class="status st0">未打印</span>';
let err=it.err?`<div class="err">异常: ${it.err}</div>`:'';
html+=`<div class="item"><div class="row1"><div class="code">${it.code}</div>${ps}</div>
<div class="grid">
<div>平台<br><b>${it.platformText||it.platform||'-'}</b></div>
<div>库位<br><b>${it.space||'-'}</b></div>
<div>箱数<br><b>${it.boxes||'-'}</b></div>
<div>毛重<br><b>${it.weight||'-'}</b></div>
<div>店铺<br><b>${(it.shop||'-')}</b></div>
<div>站点<br><b>${it.site||'-'}</b></div>
</div>${err}
<button id="btn_${it.id}" onclick="doPrint(${it.id},'${it.code}','${it.platform}',${it.boxes||0})">打印箱子标签</button>
</div>`;
});
document.getElementById('list').innerHTML=html;
}

async function loadList(){
try{
let r=await fetch('https://jie-2026erp.github.io/nantang-mobile-print/ship_data.json?t='+Date.now());
let d=await r.json();
render(d.list||[]);
document.getElementById('time').textContent='更新于 '+(d.time||'');
}catch(e){document.getElementById('time').textContent='刷新失败，请点重试'}
}

async function doPrint(id,code,platform,boxes){
let btn=document.getElementById('btn_'+id);
btn.disabled=true;btn.textContent='正在提交...';
try{
let tr=await fetch('https://api.github.com/repos/'+REPO+'/contents/ship_tasks.json',{headers:{'User-Agent':'print-app'}});
let tf=await tr.json();
let content=JSON.parse(atob(tf.content));
content.push({id:id,code:code,platform:platform,boxes:boxes,time:new Date().toISOString(),status:'pending'});
let body={message:'print '+code,content:btoa(unescape(encodeURIComponent(JSON.stringify(content,null,2)))),sha:tf.sha};
await fetch('https://api.github.com/repos/'+REPO+'/contents/ship_tasks.json',{method:'PUT',headers:{Authorization:'token '+TOKEN,'User-Agent':'print-app','Content-Type':'application/json'},body:JSON.stringify(body)});
btn.textContent='已提交，等待打印...';
let check=setInterval(async()=>{
let r=await fetch('https://api.github.com/repos/'+REPO+'/contents/ship_tasks.json',{headers:{'User-Agent':'print-app'}});
let j=await r.json();
let t=JSON.parse(atob(j.content));
let task=t.find(x=>x.id==id);
if(task&&task.status==='done'){clearInterval(check);btn.textContent='✓ 打印成功';btn.classList.add('ok');setTimeout(loadList,3000)}
if(task&&task.status==='error'){clearInterval(check);btn.textContent='✗ 打印失败:'+(task.msg||'');btn.classList.add('err');btn.disabled=false}
},2000);
}catch(e){btn.textContent='错误: '+e;btn.disabled=false}
}

async function doManual(){
let inp=document.getElementById('manualCode');
let code=(inp.value||'').trim();
if(!code){alert('请输入货件单号');return}
let btn=document.getElementById('manualBtn');
btn.disabled=true;btn.textContent='正在提交...';
try{
let tr=await fetch('https://api.github.com/repos/'+REPO+'/contents/ship_tasks.json',{headers:{'User-Agent':'print-app'}});
let tf=await tr.json();
let content=JSON.parse(atob(tf.content));
content.push({code:code,id:null,platform:'',boxes:0,manual:true,time:new Date().toISOString(),status:'pending'});
let body={message:'manual print '+code,content:btoa(unescape(encodeURIComponent(JSON.stringify(content,null,2)))),sha:tf.sha};
await fetch('https://api.github.com/repos/'+REPO+'/contents/ship_tasks.json',{method:'PUT',headers:{Authorization:'token '+TOKEN,'User-Agent':'print-app','Content-Type':'application/json'},body:JSON.stringify(body)});
btn.textContent='已提交，等待打印...';
let check=setInterval(async()=>{
let r=await fetch('https://api.github.com/repos/'+REPO+'/contents/ship_tasks.json',{headers:{'User-Agent':'print-app'}});
let j=await r.json();
let arr=JSON.parse(atob(j.content));
let task=[...arr].reverse().find(x=>x.code===code);
if(task&&task.status==='done'){clearInterval(check);btn.textContent='✓ 打印成功';btn.classList.add('ok');inp.value='';setTimeout(loadList,3000)}
if(task&&task.status==='error'){clearInterval(check);btn.textContent='✗ 打印失败:'+(task.msg||'');btn.classList.add('err');btn.disabled=false}
},2000);
}catch(e){btn.textContent='错误: '+e;btn.disabled=false}
}
render(ITEMS);
</script></body></html>
